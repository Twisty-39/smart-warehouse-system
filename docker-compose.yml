services:
  # ==============================================================================
  # 1. DATABASE SERVICE: Microsoft SQL Server 2022 (Linux Container)
  # ==============================================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invware-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Password123!SafeStrong}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433" # Buka jika ingin konek dari SQL Server Management Studio (SSMS) lokal
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==============================================================================
  # 2. BACKEND API SERVICE: C# ASP.NET Core 10 Web API
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invware-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=SmartWarehouseDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123!SafeStrong};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "${JWT_KEY:-SmartWarehouseEnterpriseSecretKey2026SecureLongKeyForHMACSHA256!}"
      Jwt__Issuer: "SmartWarehouseApi"
      Jwt__Audience: "SmartWarehouseClient"
      Jwt__ExpiryMinutes: "60"
    volumes:
      - uploads_data:/app/wwwroot/uploads

  # ==============================================================================
  # 3. FRONTEND & REVERSE PROXY: React 19 SPA + Nginx
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invware-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sql_data:
    driver: local
  uploads_data:
    driver: local
